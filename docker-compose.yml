version: '3.8'

services:
  omnistudio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnistudio_canvas
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - omnistudio_uploads:/app/uploads
      - omnistudio_outputs:/app/outputs
    restart: unless-stopped

volumes:
  omnistudio_uploads:
  omnistudio_outputs: