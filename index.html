<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStudio Professional Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121214;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 50px;
      background-color: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand { font-weight: 700; font-size: 16px; color: #3b82f6; display: flex; align-items: center; gap: 8px; }
    .toolbar-actions { display: flex; gap: 10px; align-items: center; }
    
    /* PERFORMANCE PROFILER HUD BADGE */
    #perf-hud {
      background-color: #09090b;
      border: 1px solid #10B981;
      color: #10B981;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    button.btn, label.btn {
      background-color: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn:hover, label.btn:hover { background-color: #3f3f46; }
    button.btn-primary { background-color: #2563eb; border-color: #3b82f6; }
    button.btn-primary:hover { background-color: #1d4ed8; }
    #workspace { flex: 1; display: flex; overflow: hidden; }
    .panel {
      width: 260px;
      background-color: #18181b;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
    }
    .panel-right { border-right: none; border-left: 1px solid #27272a; width: 280px; }
    .panel-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
      border-bottom: 1px solid #27272a;
    }
    .panel-content { padding: 12px; flex: 1; overflow-y: auto; }
    .layer-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #202023;
    }
    .layer-item:hover { background-color: #27272a; }
    .layer-item.active { background-color: #2563eb; color: #ffffff; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      background-color: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
    }
    #viewport-container {
      flex: 1;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas {
      border: 1px solid #27272a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      max-width: 95%;
      max-height: 95%;
    }
  </style>
</head>
<body>

  <!-- TOP TOOLBAR -->
  <header>
    <div class="brand">⚡ OmniStudio Professional</div>
    
    <div class="toolbar-actions">
      <!-- REAL-TIME SYSTEM PERFORMANCE HUD -->
      <div id="perf-hud">⚡ 60 FPS | Wasm Heap: 64 KB | Nodes: 0</div>

      <button class="btn" id="btn-add-text">➕ Add Text</button>
      <button class="btn" id="btn-add-rect">➕ Add Liquid Box</button>
      <button class="btn btn-primary" id="btn-save">💾 Save Graph</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div id="workspace">
    <div class="panel">
      <div class="panel-header">Layers Hierarchy</div>
      <div class="panel-content" id="layer-tree"></div>
    </div>

    <div id="viewport-container">
      <canvas id="viewport"></canvas>
    </div>

    <div class="panel panel-right">
      <div class="panel-header">Property Inspector</div>
      <div class="panel-content" id="inspector-content">
        <p style="font-size: 13px; color: #71717a;">Select an element on canvas or layer panel to edit properties.</p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
